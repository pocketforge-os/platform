# Opt-in A133 open PowerVR stack. The firmware-only PowerVR blob group will be
# added by the later vendor-manifest custody bead; boot-chain and Wi-Fi remain.
[device]
base = "a133"
id = "a133-open"

[kernel]
repo = "kernel-sunxi-6.x"
ref = "device/a133"
defconfig = "a133_defconfig"
dtb = "sun50i-a133-pocketforge-tsp.dtb"

[gpu]
model = "open"
repo = ""
ref = ""
km_model = "in-tree-6.x"
km_repo = "kernel-sunxi-6.x"
km_ref = "device/a133"
um_repo = "gpu-um-tsp"
um_ref = "main"
modules = ["powervr.ko"]

[blobs]
groups = ["sunxi-a133-boot-chain", "sunxi-a133-wifi-firmware"]
