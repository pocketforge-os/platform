# platform/devices/a133/capabilities.toml — TrimUI Smart Pro (Allwinner A133 / TG5040).
#
# The NET-NEW capability descriptor — a SIBLING to profile.toml, joined ONLY by
# device.id. profile.toml owns kernel/gpu/bootchain; THIS file owns what the device can
# SENSE, ACTUATE, and LOOK LIKE. One descriptor, three consumers (broker / simulator / CI).
# Validate: `pf caps validate a133`. Schema: schemas/capabilities.schema.json. Authored
# from hardware-firmware-probes.md §§5,13,14 + the FCC external-photo layout (2BD9O-TG5040).
#
# INVARIANTS: descriptor = EXPECTATION; the live EVIOCGBIT/EVIOCGABS probe = GROUND TRUTH
# (SPIKE-0 / tsp-9sx.1 reconciles on silicon). Missing hardware = ROW OMISSION, never a
# fabricated row. The gamepad is one Xbox-360 HID (045e:028e) that advertises a SUPERSET of
# codes (incl. BTN_THUMBL/R) the base chassis does not physically wire — so this file lists
# only the PHYSICAL, drawable controls; the SPIKE-0 fidelity check is asymmetric (these
# codes ⊆ the probe's advertised codes; extra advertised codes are expected, not mismatches).

# Default "confirm" face button (Xbox/PS = south, Switch-region = east). A HINT only;
# full confirm/cancel/action mapping is the broker/SDK layer's job (E2), not this file.
accept_default = "south"

[identity]
id           = "a133"
manufacturer = "TrimUI"
model        = "Smart Pro"
codename     = "5040"                                # Android-picker leaf: TrimUI > 5040 (Pro)
sdl_guid     = "030000005e0400008e02000010010000"   # Xbox-360 wired; ship gamecontrollerdb verbatim (probe §13)
match        = { evdev_name = "TRIMUI Player1", vid = "045e", pid = "028e" }

# Screen = render INTENT, not panel pixel truth. The app draws a LANDSCAPE 1280x720 canvas;
# the disp engine rotates it onto the physically-portrait panel (present=portrait). The
# rotation MECHANISM (A133 legacy disp2, derived rotate-768) is per-SoC CODE, not data here
# — only the logical enum is carried. Panel dims live in the kernel DTS (lcd0), not here.
[[screens]]
role          = "primary"
present       = "portrait"
rotation      = "cw90"
render_canvas = { w = 1280, h = 720 }
display_rect  = { x = 332, y = 108, w = 816, h = 443 }  # model-derived projected active panel

# ---- INPUTS: each row = one drawable, bindable PHYSICAL control ----
# Face labels are NINTENDO-arranged on the shared chassis (east=A, south=B, north=X, west=Y):
# attested by the A523 SPIKE-0 press-test (2026-07-11) + the FCC 2BD9O-TG5040 photos; the
# positional ids/codes are unchanged. Owner visual OK rides the .3 skin gate.
# Face buttons — POSITIONAL ids (south/east/west/north, SDL3-aligned); the printed glyph
# is in `label`. Binding is by POSITION so a Switch-format device differs by DATA only
# (swap the labels + accept_default), never code or skin. `code` is what the DRIVER EMITS
# for that position (the wire), which the broker remaps onto the canonical positional code
# for the `id` — trust the id for position, the code for the wire.
#
# All four rows are now CANONICAL POSITIONAL codes (tsp-ozbp.14), i.e. the a133 broker remap
# is an IDENTITY. That is the honest state because we OWN this device's input source: it is
# pf-input-decode (our Rust MCU decoder), not the vendor xpad driver, and as of tsp-ozbp.14 it
# emits kernel-canonical positional codes directly. The pre-ownership west/north rows recorded
# xpad's west↔north quirk (west=BTN_X 0x133, north=BTN_Y 0x134); describing a quirk is right for
# a driver you cannot fix and wrong for one you can, so the quirk was fixed at the source and
# these rows follow. South/east were already canonical and are UNCHANGED.
#
# The positional spelling is deliberate: BTN_WEST/BTN_NORTH are the same NUMBERS as BTN_Y/BTN_X
# (the kernel aliases them), but a lettered spelling cannot say whether it means the printed
# glyph or the position — and on this Nintendo-arranged faceplate those disagree. That ambiguity
# is what shipped an A/B swap. probe-diff compares BTN_* by resolved code VALUE, so a capture
# that names 0x134 "BTN_Y" still matches this row. Emits the canonical X360 gamecontrollerdb
# (a:b0,b:b1,x:b2,y:b3) unchanged — build_sdldb_mapping is keyed by value, not spelling.
[[inputs]]
id = "south"
kind = "button"
ev_type = "EV_KEY"
code = "BTN_A"
label = "B"
skin_part = "btn_south"
[[inputs]]
id = "east"
kind = "button"
ev_type = "EV_KEY"
code = "BTN_B"
label = "A"
skin_part = "btn_east"
[[inputs]]
id = "west"
kind = "button"
ev_type = "EV_KEY"
code = "BTN_WEST"
label = "Y"
skin_part = "btn_west"
[[inputs]]
id = "north"
kind = "button"
ev_type = "EV_KEY"
code = "BTN_NORTH"
label = "X"
skin_part = "btn_north"
# System buttons. guide = BTN_MODE (advertised + listed for the base unit; SPIKE-0 confirms
# the physical press). The Pro S adds a SEPARATE Home key — see devices/a523.
[[inputs]]
id = "select"
kind = "button"
ev_type = "EV_KEY"
code = "BTN_SELECT"
skin_part = "btn_select"
[[inputs]]
id = "guide"
kind = "button"
ev_type = "EV_KEY"
code = "BTN_MODE"
skin_part = "btn_guide"
[[inputs]]
id = "start"
kind = "button"
ev_type = "EV_KEY"
code = "BTN_START"
skin_part = "btn_start"
# Shoulders (digital).
[[inputs]]
id = "l1"
kind = "button"
ev_type = "EV_KEY"
code = "BTN_TL"
skin_part = "btn_l1"
[[inputs]]
id = "r1"
kind = "button"
ev_type = "EV_KEY"
code = "BTN_TR"
skin_part = "btn_r1"
# D-pad as an ABS hat (classic Xbox layout).
[[inputs]]
id = "dpad"
kind = "hat"
ev_type = "EV_ABS"
code = "ABS_HAT0X,ABS_HAT0Y"
skin_part = "dpad"
# Analog sticks — NOT clickable on the base unit (no L3/R3 rows; the Pro S adds them).
# Ranges are UNSIGNED 12-bit (0..4095), NOT signed16 (tsp-ozbp.13). The old { -32768..32767 }
# described a device we do not ship: it was wrong in span (~16x) AND in sign convention. THREE
# independent lines of evidence say unsigned-12-bit-centred-at-mid-scale:
#   - OUR OWN decoder: pf-input-decode (runtime) declares ABS_X/Y/RX/RY EVIOCGABS as 0..4095
#     (crates/pf-input-decode/src/lib.rs, STICK_MAX=4095). The descriptor was contradicting the
#     very decoder that feeds it — the exact "contract vs hardware disagree, silently" defect.
#   - owner-actuated on-silicon sweep (tsp-bwrg.14, 2026-07-27): every observed value ∈ 0..4095,
#     rests near mid-scale — lstick ABS_X min1054 max3422 rest2092 / ABS_Y 755..3301 rest2137;
#     rstick ABS_RX 898..3329 rest2014 / ABS_RY 939..3363 rest2133.
#   - tsp-ozbp.9's independent rest capture corroborated those rests within tol 40.
# DELIBERATE SHAPE CHOICE (the bead asked us to decide and say why):
#   min/max = 0/4095 — the honest full-scale ELECTRICAL range, not one human sweep's extremes
#     (those under-report the range: a hand never hits the mechanical stops, and per-unit variation
#     is real; freezing 1054..3422 as the class min/max would repeat the "one node/one unit → class"
#     over-generalization this lane exists to kill).
#   fuzz/flat = 0 — NOT measured. The old 16/128 were signed16-scale absolute counts that do not
#     survive a range change, and no deadzone was ever measured. We claim NO deadzone rather than
#     invent one — the SAME honest convention as the a523 sibling's sticks (fuzz=0, flat=0). The
#     measured rest offset (~+70 above 2048, consistent across axes) and a real deadzone are a
#     future calibration follow-up; the rests are RECORDED here in-comment, deliberately NOT frozen
#     into a machine `value`/`flat` that would present one unit's reading as the device class.
# `probe-diff` reconciles these min/max against the live EVIOCGABS (0..4095) → now clean.
[[inputs]]
id = "lstick"
kind = "stick"
ev_type = "EV_ABS"
code = "ABS_X,ABS_Y"
skin_part = "stick_l"
x = { min = 0, max = 4095, fuzz = 0, flat = 0 }
y = { min = 0, max = 4095, fuzz = 0, flat = 0 }
[[inputs]]
id = "rstick"
kind = "stick"
ev_type = "EV_ABS"
code = "ABS_RX,ABS_RY"
skin_part = "stick_r"
x = { min = 0, max = 4095, fuzz = 0, flat = 0 }
y = { min = 0, max = 4095, fuzz = 0, flat = 0 }
# L2/R2 — a BINARY ACTUATOR reported on ANALOG wire channels (same switch hardware as the
# Pro S; owner ground truth), modeled on the Xbox-360 TRIGGER AXES, not BTN_TL2/TR2.
# Evidence (SPIKE-0, 2026-07-11): the stock a133 probe (hardware-firmware-probes.md §13)
# advertises ABS=3003f (Z/RZ) and NO BTN_TL2/TR2; the A523 press-test on the shared
# trimui_inputd stack fired endpoint-only full-swing ABS_Z/RZ 0<->255 (accidental graze
# included — switch-with-no-proportional-range). On-silicon a133 press confirmation is
# deferred until PocketForge ships an input-synthesis layer (tsp-ozbp). The `semantics`
# field (tsp-v19s) carries the binary-endpoint truth for the E2 broker / E5 sim / CI.
[[inputs]]
id = "ltrig"
kind = "trigger"
ev_type = "EV_ABS"
code = "ABS_Z"
semantics = "binary"
range = { min = 0, max = 255, fuzz = 0, flat = 0 }
skin_part = "trig_l"
[[inputs]]
id = "rtrig"
kind = "trigger"
ev_type = "EV_ABS"
code = "ABS_RZ"
semantics = "binary"
range = { min = 0, max = 255, fuzz = 0, flat = 0 }
skin_part = "trig_r"

# Volume rocker — VOL+ / VOL- (tsp-bwrg.16). These are REAL physical controls, but they do NOT
# live on the gamepad node: the a133 exposes THREE input nodes, and the volume keys are on the
# LRADC `sunxi-keyboard` node (event0), firing KEY_VOLUMEUP(115)/KEY_VOLUMEDOWN(114) — proven on
# silicon by tsp-ozbp.2's VOL± negative control (pressing VOL± fired 117 event0 KEY_VOLUME* events,
# zero UART bytes). The gamepad node (event2 "TRIMUI Player1") does NOT advertise 114/115 at all
# (word1 of its KEY bitmap is zero), which is why the single-`--source` collector could never
# capture them — the structural miss this bead exists to fix.
#
# class = "system" (NOT the default "gamepad"): the E2 broker must never hand VOL± to an app as a
# bindable control (they are ambient system authority — volume is a platform/settings concern).
# This is a POLICY marker on an HONEST device description, not a reason to omit the row: describe
# the whole device, gate access in the broker (owner ruling 2026-07-27, on this bead). Because
# class=system, caps.py's SDL emit skips them — no `sdl_guid` gamepad binding is ever synthesised
# for the volume rocker.
# source = "sunxi-keyboard" — the evdev NODE these live on. Every other input here omits `source`
# and defaults to the primary gamepad node (identity.match.evdev_name = "TRIMUI Player1"); VOL±
# name their real node explicitly so the multi-source collector reads event0 for them, not event2.
# NOTE `event1` (audiocodec Audio Jack) ALSO advertises 114/115 — the inline-remote keys of a wired
# headset — so "volume" is ambiguous at the evdev layer; this row is the CHASSIS rocker on event0.
# Whether the shim also merges the headset-remote node is a broker/collection decision (tracked with
# the multi-source work), deliberately NOT frozen here.
[[inputs]]
id = "vol_up"
kind = "button"
ev_type = "EV_KEY"
code = "KEY_VOLUMEUP"
class = "system"
source = "sunxi-keyboard"
[[inputs]]
id = "vol_down"
kind = "button"
ev_type = "EV_KEY"
code = "KEY_VOLUMEDOWN"
class = "system"
source = "sunxi-keyboard"

# ---- ACTUATORS ----
# 23 addressable RGB LEDs (sunxi_led0..22 ×rgb) = the analog-stick rings + edge (probe §14).
# NO rumble on the base unit (omitted — the Pro S adds pwm-vibrator).
[[actuators]]
id = "leds"
kind = "led_array"
controller = "sunxi_led"
count = 23

# NO [[sensors]] — the base unit has no accel/gyro/mag (probe §§11-16). Omission, not a stub.

# ---- SKIN (AVD clickable-skin model; rendered from the semantic 1:1 CAD) ----
# body/body_lit are generated by device-models/trimui-smart-pro/render.py from
# the millimetre-coordinate OpenSCAD source. Rectangles are derived from
# one-control-at-a-time highlight renders. The atlas is composed only after all
# rectangles are pairwise disjoint; stacked shoulder crops are split/trimmed so
# L1/L2 and R1/R2 remain independently lit without touching front controls.
[skin]
body     = "skins/a133/body.png"
lit_body = "skins/a133/body_lit.png"

[skin.parts]
dpad       = { x = 109,  y = 147, w = 144, h = 142 }
stick_l    = { x = 113,  y = 366, w = 147, h = 143 }
stick_r    = { x = 1220, y = 366, w = 147, h = 143 }
btn_north  = { x = 1271, y = 134, w = 55,  h = 56 }
btn_east   = { x = 1326, y = 190, w = 57,  h = 55 }
btn_south  = { x = 1271, y = 245, w = 55,  h = 56 }
btn_west   = { x = 1215, y = 190, w = 56,  h = 55 }
btn_select = { x = 1174, y = 528, w = 55,  h = 52 }
btn_guide  = { x = 207,  y = 527, w = 55,  h = 53 }
btn_start  = { x = 1244, y = 527, w = 54,  h = 53 }
btn_l1     = { x = 75,   y = 94,  w = 189, h = 53 }
btn_r1     = { x = 1216, y = 94,  w = 189, h = 40 }
trig_l     = { x = 67,   y = 25,  w = 196, h = 69 }
trig_r     = { x = 1217, y = 25,  w = 196, h = 69 }

# ---- Additional CLICKABLE VIEWS (tsp-65jc.27) ----
# The sim GUI can rotate the device to a dedicated TOP-EDGE view whose shoulder/
# trigger controls are prominent and clickable. Each view is the same .scad rendered
# from another camera into its own body_<view>/body_lit_<view> atlas (generated by
# render.py --write-views) with its OWN parts table; a view carries NO display_rect
# (the screen is a front-face feature). The rects below are the model-derived crops
# for the `top` camera and are kept in lockstep with skins/a133/model-render.json
# ["views"]["top"] by check-skin-drift.py — do not hand-edit; regenerate with
# render.py --write-views. Controls not visible from a view are simply absent here.
[skin.views.top]
body     = "skins/a133/body_top.png"
lit_body = "skins/a133/body_lit_top.png"

[skin.views.top.parts]
btn_l1     = { x = 60,   y = 310, w = 193, h = 26 }
trig_l     = { x = 52,   y = 255, w = 200, h = 55 }
btn_r1     = { x = 1227, y = 310, w = 193, h = 26 }
trig_r     = { x = 1228, y = 255, w = 200, h = 55 }
