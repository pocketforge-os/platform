ref  = "device/a133"           # tsp-mc9m.60.7.2.3.12: kernel-sunxi-6.x#279 rejects a phase-shifted KO sync response. A cold start loses odd-byte phase, so "KO" is the K tail of one OK plus the O head of the next; accepting it left a K to prefix the BROM ACK and SETUART read "KBRO" -> -EILSEQ. KO tolerance is kept until a discard or retained partial proves phase loss, so the warm rebind path is unchanged by construction.
                              # tsp-mc9m.60.7.2.3.12.1.1: kernel-sunxi-6.x#280 merged as 6ccb87902144babc2838b03840c0413bf0941ab4 after independent review of 2fb210bf7196ed22352a8af51425db9bfd848eb3; publishes bounded receive-callback provenance only.
                              # Prior (8dc9064df7a5d838d1a0c24ffb6a5fbdda00ec50): tsp-mc9m.60.7.2.3.11.1: kernel-sunxi-6.x#278 waits for asserted CTS before the first HCI command. The port is UPSTAT_AUTOCTS (8250_dwlib.c sets UART_CAP_AFE), so queuing HCI_Reset before the firmware asserted CTS left it gated in hardware with icount.tx frozen; AUTOCTS ports get no software TX restart on the later CTS edge. Bounded 200ms, fail-closed.
                              # Prior (9826b9ddfed526acfcafdd326a7ea66676929038): tsp-mc9m.60.7.2.3.11: kernel-sunxi-6.x#277 adds a first-HCI-command discriminator reporting TX progression, CTS, bounded drain, pre-parser raw RX and parser outcome on the success path; physical-tx stays explicitly unproven.
                              # Prior (9cf71ac4b1ea37bc923148eb1ee84a7c37610ce6): tsp-mc9m.60.7.2.3.6.1: kernel-sunxi-6.x#276 restores sync phase by discarding one byte after a detected non-token window.
                              # Prior (6c9ffff8197d9c9f864c51a5497591bd42c2a6a3): tsp-mc9m.60.7.2.3.9.1: kernel-sunxi-6.x#275 adds strict BROM desync detection and bounded reset recovery.
                              # Prior (1cc29436b9a115536a47cabcee29c1e9f231d9e9): tsp-mc9m.60.7.2.3.10.1: kernel-sunxi-6.x#274 adds a post-sync silent listen window.
                              # Prior (6e713f13868a2da83d4fa54aeed38c9a656b33bf): tsp-mc9m.60.7.2.3.8.1: kernel-sunxi-6.x#268-#271 add BROM receive instrumentation that separates a sync leftover from the reply's own first byte, including accepted-sync first-byte timing and the first slid byte.
                              # Prior (5128b064cb1bf8796b842f31fc28f1b7f4871992): tsp-mc9m.60.7.2.3.5.2: kernel-sunxi-6.x#268-#271 add BROM receive instrumentation that separates a sync leftover from the reply's own first byte.
                              # Prior (92f10f7841978b67715472aa1342873a02ad1c17): tsp-mc9m.60.7.2.3.4.1: kernel-sunxi-6.x#268/#269 add BROM receive instrumentation that separates a sync leftover from the reply's own first byte.
                              # Prior (f2e87d19d3d3acbda9aebc966e91909c6178b2cb): tsp-mc9m.60.7.2.4.1: kernel-sunxi-6.x#267 adds a receive gate so the BROM sync's leftover byte can no longer prefix the following exchange.
                              # Prior (468ceb3e1ea4809c889a3f3eb77f24a3786c29b2): tsp-mc9m.60.7.2.3.1: kernel-sunxi-6.x#265 fixes BROM receive framing so a one-byte phase shift cannot survive sync and trigger -71 on the next exchange.
                              # Prior (8c02ba4e51ad70654662aa1b981570ce64acf174): tsp-mc9m.60.7.2.2.3.1: kernel-sunxi-6.x#264 shrinks the dump's hot-path footprint so the -71 BROM failure can reproduce on a kernel that reports it.
                              # Prior (db67a46d9bcdf33a736f87354ae33593657f2346): tsp-mc9m.60.7.2.2.2.1: kernel-sunxi-6.x#263 carries the sync attempt count into every failure dump for stale-sync-byte prediction 2.
                              # Prior (977321935860ad1f9c99f52ae63f072a7c3e95c3): tsp-mc9m.60.7.2.2.1: kernel-sunxi-6.x#262 adds BROM receive diagnostics for the next bench boot.
                              # Prior (e5284c032266a754b61cffe412a8ab2d0c0ec658): tsp-mc9m.60.7.2.1: XR829 Bluetooth reset moves from PL11 (the R_CIR consumer-IR input) to PL2, matching the vendor DTS and decompiled stock DTB.
