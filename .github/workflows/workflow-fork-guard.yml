name: workflow fork guard

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pf-pr-review]
    steps:
      - name: checkout the tested ref and validate self-hosted job fork guards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wd="$RUNNER_TEMP/platform-workflow-fork-guard-$GITHUB_RUN_ID"
          rm -rf "$wd"
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$wd"
          cd "$wd"
          git fetch --quiet origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          scripts/tests/workflow-fork-guard-test.sh --self-test
          scripts/tests/workflow-fork-guard-test.sh
          # Host-route guard (incident tsp-ihne1.56.5): this workflow has NO paths filter,
          # so the static host-route scan runs for every PR — including one that only touches
          # a DIFFERENT workflow file. Wiring the scan here (not just in the path-filtered
          # sim-descriptor-gate.yml) closes the fail-open gap where a forbidden route added
          # to any scanned workflow would skip the guard. Stdlib-only python, no docker.
          scripts/tests/workflow-host-route-test.sh --self-test
          scripts/tests/workflow-host-route-test.sh
          # Canonical host-route spec port (runtime 0b1b5d09, bead tsp-ihne1.56.5):
          # vendored-fixture sha256 check, the canonical inventory self-test (97 seeded
          # red/green cases incl. the `--` dynamic-image rule and seat-host runs-on reds)
          # and the plain scan over every tracked workflow/template/script (host-route
          # findings + runs-on eligibility vs the vendored runner-host map).
          bash tests/test-vendored-sources.sh
          python3 tests/uinput_inventory.py --self-test
          python3 tests/uinput_inventory.py
