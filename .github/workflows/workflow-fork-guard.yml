name: workflow fork guard

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pf-pr-review]
    steps:
      - name: checkout the tested ref and validate self-hosted job fork guards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wd="$RUNNER_TEMP/platform-workflow-fork-guard-$GITHUB_RUN_ID"
          rm -rf "$wd"
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$wd"
          cd "$wd"
          git fetch --quiet origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          echo "PF_POLICY_ROOT=$wd" >> "$GITHUB_ENV"
          scripts/tests/workflow-fork-guard-test.sh --self-test
          scripts/tests/workflow-fork-guard-test.sh

      - name: Enforce CI producer policy
        run: |
          python3 "$PF_POLICY_ROOT/scripts/tests/ci-producer-policy-test.py"
          python3 "$PF_POLICY_ROOT/scripts/ci-producer-policy.py" \
            --root "$PF_POLICY_ROOT" \
            --default-branch main
