name: problem report schema gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'schemas/problem-report-v1/**'
      - '.github/workflows/problem-report-schema.yml'
  push:
    branches: [main]
    paths:
      - 'schemas/problem-report-v1/**'
      - '.github/workflows/problem-report-schema.yml'

permissions:
  contents: read

jobs:
  validate:
    name: problem-report-schema
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pf-public-ci]
    steps:
      - name: Fixtures and property tests for problem report v1
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          wd="$(mktemp -d "${RUNNER_TEMP:?}/platform-problem-report.XXXXXX")"
          trap 'find "$wd" -mindepth 1 -delete; rmdir "$wd"' EXIT
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$wd/src"
          cd "$wd/src"
          sha="${HEAD_SHA:-$GITHUB_SHA}"
          git fetch --quiet origin "$sha"
          git checkout --quiet --detach "$sha"
          python3 schemas/problem-report-v1/test_contract.py -v
