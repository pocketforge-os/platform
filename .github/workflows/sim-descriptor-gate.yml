# sim-descriptor-gate — the platform-side sim gate (infra-113 §6 Phase B3, decision D5 / tsp-65jc.5).
#
# WHY THIS EXISTS. The device descriptors (devices/<id>/capabilities.toml), the rendered skins
# (skins/<id>/*), the 3D device models (device-models/<model>/*), and the schemas (schemas/**) are
# what the pocketforge-sim toolchain consumes to prove a device's control/sensor/skin behaviour.
# Before this gate, a platform-side descriptor/skin/model change could merge with ZERO sim
# validation — exactly what happened on 2026-07-22 (a descriptor + skin change merged unvalidated;
# infra-113 §1 / finding 4). The sim repo's own `sim-gate.yml` only runs the suite when SIM changes;
# nothing ran it when the PLATFORM data those suites consume changed. This gate closes that hole on
# the platform side: on a PR that touches the descriptor chain, it builds the reproducible
# pocketforge-sim image with sim PINNED (current sim main) and the platform descriptors OVERRIDDEN
# to THIS PR's head, then runs the headless suite. So the PR's own CI run proves the sim still
# passes against the descriptors the PR is proposing.
#
# THE PIN-OVERRIDE MECHANIC (infra-113 D5; no sim-side PR needed). The sim Dockerfile already builds
# its `platform` stage from a `PLATFORM_REPO` + `PLATFORM_COMMIT` build-arg pair (default = the pin
# of record, sim's docker/platform.pin). We reuse that first-class override: clone sim at main
# (the pinned sim), then `docker build --build-arg PLATFORM_COMMIT=<this PR's head sha>`. sim's build
# is otherwise identical to its own gate; only the descriptor source moves to the PR head. Reachable
# because the fork guard (below) restricts us to same-repo PRs, whose head sha is a branch tip a full
# `git clone` of public platform necessarily fetches — no extra fetch or sim change required. On
# `workflow_dispatch` (no PR) the build-arg is omitted and the image uses sim's baked pin, so a manual
# run smoke-tests the gate against pinned main.
#
# ADVISORY POSTURE — DELIBERATE (infra-113 D5, B4/B2 ladder). This is NOT a required status check: a
# red run reports, it does not block merge. Promotion to REQUIRED is a separate governance bead under
# the B4 posture ladder (per-device blocking/advisory derived from platform data), NOT flipped here.
#
# PATHS FILTER — DELIBERATE, and SAFE ONLY WHILE ADVISORY (same rationale as skin-drift.yml). An
# advisory check may be path-filtered to the only paths that can move the descriptor chain, which is
# the cheaper trigger surface the bead asks for and keeps this ~30-40min build off unrelated PRs. IF
# THIS GATE IS EVER PROMOTED TO REQUIRED, REMOVE THE `paths:` FILTERS (mirror abi-drift's no-filter
# rationale) — a required check gated by `paths:` hangs "expected" forever on unrelated PRs.
#
# NO `push: main` TRIGGER — DELIBERATE (matches sim/sim-gate.yml, NOT the cheap abi-drift/skin-drift
# checks). This is an expensive full image build + nested suite (~30-40min on the builder VM); a post-merge
# rebuild of every descriptor merge would burn the build-lab for a signal the PR run already gave.
# `workflow_dispatch` covers the "run it on demand against main" case.
#
# NO MARKETPLACE ACTIONS — DELIBERATE (matches abi-drift/skin-drift + the org pr-review-gate). The org
# requires SHA-pinned actions (org Actions policy sha_pinning_required=true), so a bare tag ref yields
# a startup_failure. This job uses ZERO `uses:` actions: it needs no platform checkout at all (the
# descriptors reach the build via the sim Dockerfile's own pinned git clone of platform @ the PR head
# sha), so it just `git clone`s sim with the ephemeral github.token and drives docker directly.
#
# RUNNER ROUTING + FORK GUARD — DELIBERATE (build-lab confinement invariant, tsp-20u1). The nested sim
# needs /dev/uinput + SYS_ADMIN + unconfined seccomp/apparmor (the tsp-qc1.2 verdict; infra-113
# finding 9 — irreducible, self-hosted only), so this targets the self-hosted builder VM (org runner
# `mm-build-vm`, label `pf-builder-vm`; a KVM guest on modelmaker) — the infra-113 Option B off-Dell
# builder end-state, now REALIZED (tsp-65jc.24), which moves this docker = host-root-equivalent
# workload OFF the labgrid arbitration host. That runner still must NEVER execute code authored
# outside the org. The job-level `if:` fork guard below makes that MECHANICAL: the job skips whenever
# the PR head repo is not this repository, so even a maintainer-APPROVED fork PR never executes here
# (advisory, so a skip blocks nobody). platform reaches the builder VM through its runner group
# (build-lab today; moving to a dedicated public-repo-scoped `pf-builder` group in the same bead).
# Canonical doc: mission-control BUILD_PIPELINE.md "Build-lab confinement invariant".

name: sim descriptor gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'devices/**'
      - 'skins/**'
      - 'device-models/**'
      - 'schemas/**'
      - '.github/workflows/sim-descriptor-gate.yml'
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN for a job that executes untrusted (org-authored, per the fork guard)
# code on the build-lab runner. The build clones public sim + public platform over https and neither
# reads this repo beyond nothing nor writes anything back, so read-only contents is sufficient.
permissions:
  contents: read

concurrency:
  group: sim-descriptor-gate-${{ github.ref }}
  cancel-in-progress: true

# DATA-DRIVEN MATRIX — TWO JOBS (infra-113 B4 / D6). The device rows + per-device posture are NOT a
# hardcoded list; they come from platform ci-matrix.toml via `pf caps matrix`.
# ADD A DEVICE = ADD DATA — adding a device is a pure data change (descriptor + .scad skin + posture
# row), NOT a workflow edit; a new descriptor auto-joins as advisory. Cold-start walkthrough:
# sim/docs/ADD-A-DEVICE.md.
# The gate is split so
# the DATA is validated + derived CHEAPLY on every descriptor PR, and only the expensive sim build
# runs the suites:
#   1. descriptor-matrix (pf-pr-review VM lane, sub-second): `pf caps matrix validate` fails fast on a
#      bad posture / an unclassified device dir / a gating posture with no descriptor; then it derives
#      the blocking + advisory device lists (job outputs). A NEW descriptor auto-joins as advisory and
#      is VISIBLE in this job's log with zero workflow edits (infra-113 §8.4 auto-join proof).
#   2. sim-suite (build-lab, needs descriptor-matrix): builds the sim image with platform overridden to
#      the PR head, then runs the suites over the derived lists — BLOCKING devices hard (a failure
#      fails the job), ADVISORY devices reported-but-non-blocking. Excluded devices never run.
# This gate stays ADVISORY overall (D5: advisory first, required after stability) — the posture VALUES
# in the data are the per-device blocking/advisory keys the sim/pf-hwprobe required checks consume.
jobs:
  descriptor-matrix:
    # Cheap data-derivation + validation on the pf-pr-review VM lane — the org's designed lane for
    # running untrusted PR code read-only (same routing rationale as skin-drift/abi-drift). It executes
    # the PR head's core/caps.py (sub-second, side-effect-free), so no fork guard is needed here.
    runs-on: [self-hosted, pf-pr-review]
    outputs:
      blocking: ${{ steps.derive.outputs.blocking }}
      advisory: ${{ steps.derive.outputs.advisory }}
    steps:
      - name: Checkout the PR head + validate & derive the data-driven CI matrix
        id: derive
        env:
          GH_TOKEN: ${{ github.token }}
          # PR head sha on a pull_request; empty on workflow_dispatch (=> derive from the dispatch ref).
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          wd="$RUNNER_TEMP/platform-matrix-$GITHUB_RUN_ID"
          rm -rf "$wd"
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$wd"
          cd "$wd"
          # Prefer the PR head sha (matches what sim-suite builds the image from). A same-repo PR head
          # is a branch tip the full clone already has; a FORK PR's head lives in the fork (not here) —
          # so fall back to $GITHUB_SHA (the merge ref, always present). sim-suite skips fork PRs via its
          # fork guard anyway, so the fork path here is only about not spuriously reding this advisory job.
          sha="${HEAD_SHA:-$GITHUB_SHA}"
          git checkout --quiet --detach "$sha" 2>/dev/null || {
            echo "head sha $sha not in base repo (fork PR?) — deriving the matrix from the merge ref $GITHUB_SHA"
            git checkout --quiet --detach "$GITHUB_SHA"
          }
          # Pick a Python 3.11+ (tomllib) interpreter — no third-party deps (core/caps.py is stdlib-only).
          PY=""
          for c in python3.12 python3.11 python3; do
            if command -v "$c" >/dev/null 2>&1 && "$c" -c 'import sys;raise SystemExit(0 if sys.version_info>=(3,11) else 1)'; then
              PY="$c"; break
            fi
          done
          [ -n "$PY" ] || { echo "FATAL: no Python 3.11+ (tomllib) on this runner: $(python3 -V 2>&1 || echo none)" >&2; exit 3; }
          echo "using $PY ($("$PY" -V 2>&1)) on runner $RUNNER_NAME @ $sha"
          # Validate the posture data — a bad posture / unclassified device dir / gating posture with no
          # descriptor / stale row fails HERE, fast, on every descriptor PR (also folded into
          # `pf caps validate --all`).
          "$PY" core/caps.py matrix validate
          # Full picture — a NEW descriptor shows here as advisory with zero workflow edits (auto-join).
          echo "── CI gate matrix (data-driven from ci-matrix.toml) ──"
          "$PY" core/caps.py matrix list
          blocking="$("$PY" core/caps.py matrix list --posture blocking --format ids)"
          advisory="$("$PY" core/caps.py matrix list --posture advisory --format ids)"
          echo "blocking (a failure fails sim-suite): ${blocking:-(none)}"
          echo "advisory (reported, non-blocking):    ${advisory:-(none)}"
          echo "blocking=${blocking}" >> "$GITHUB_OUTPUT"
          echo "advisory=${advisory}" >> "$GITHUB_OUTPUT"

  sim-suite:
    needs: descriptor-matrix
    # Build-lab confinement invariant (tsp-20u1): this self-hosted runner has docker = host root and
    # must NEVER execute fork/public-PR code — the org approval gate alone still lets an APPROVED fork
    # PR run here, so this guard makes the invariant MECHANICAL: skip the job whenever the PR head is
    # not this repository. Advisory check, so a skip blocks nobody. Canonical doc: mission-control
    # BUILD_PIPELINE.md "Build-lab confinement invariant".
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pf-builder-vm]
    timeout-minutes: 45
    env:
      IMG: pocketforge-sim:plat-ci-${{ github.run_id }}
      # The platform descriptor source the sim image builds against: THIS PR's head sha on a
      # pull_request; empty on workflow_dispatch (=> sim's baked pin, docker/platform.pin, wins). NOTE:
      # on workflow_dispatch the descriptor-matrix job derives from the dispatch ref while the image is
      # built from sim's baked pin, so a device added on main but not yet re-pinned would be listed but
      # absent from the image — a benign manual-smoke corner, not the pull_request path.
      PLATFORM_SHA: ${{ github.event.pull_request.head.sha }}
      BLOCKING: ${{ needs.descriptor-matrix.outputs.blocking }}
      ADVISORY: ${{ needs.descriptor-matrix.outputs.advisory }}
    steps:
      - name: Ensure uinput module (host node is required for the nested sim)
        run: sudo modprobe uinput || true

      - name: Clone sim @ main (the pinned sim) + build with platform overridden to the PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wd="$RUNNER_TEMP/sim-src-$GITHUB_RUN_ID"
          rm -rf "$wd"
          # sim is public; the ephemeral token clones it fine. --depth 1 of main = the pinned sim tip.
          git clone --quiet --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/pocketforge-os/sim.git" "$wd"
          echo "sim @ $(git -C "$wd" rev-parse HEAD)"
          cd "$wd"
          # PLATFORM_REPO stays the Dockerfile default (public platform). PLATFORM_COMMIT is the ONLY
          # override — the PR head sha (or omitted on dispatch so the baked pin wins).
          args=(--build-arg "PLATFORM_REPO=https://github.com/${GITHUB_REPOSITORY}.git")
          if [ -n "${PLATFORM_SHA:-}" ]; then
            echo "building sim image with platform descriptors OVERRIDDEN to PR head $PLATFORM_SHA"
            args+=(--build-arg "PLATFORM_COMMIT=${PLATFORM_SHA}")
          else
            echo "workflow_dispatch: no PR head — building against sim's baked platform pin"
          fi
          docker build "${args[@]}" -t "$IMG" .

      # --network none on the RUN phase: the headless suite runs entirely from baked, pinned artifacts
      # (no out-of-band input — sim docker/README.md), so denying the run any network shrinks the blast
      # radius of the elevated caps. The caps mirror sim/sim-gate.yml's proven set (the tsp-qc1.2
      # nesting verdict): /dev/uinput + evdev nodes + SYS_ADMIN + unconfined apparmor/seccomp.
      #
      # Device lists are DATA-DRIVEN from the descriptor-matrix job (platform ci-matrix.toml), NOT a
      # hardcoded list. BLOCKING devices run hard (a failure fails this job); ADVISORY devices are
      # reported but never fail the (already advisory) gate. Each list is passed via env (validated
      # [a-z0-9-] ids) and expanded unquoted so multiple devices become separate args.
      - name: check suites — BLOCKING devices (control/sensor/skin @ PR head)
        if: needs.descriptor-matrix.outputs.blocking != ''
        run: |
          set -euo pipefail
          for suite in control sensor skin; do
            echo "== check-$suite (blocking): $BLOCKING =="
            docker run --rm --network none \
              --device /dev/uinput --device-cgroup-rule "c 13:* rmw" -v /dev/input:/dev/input \
              --cap-add SYS_ADMIN --security-opt apparmor=unconfined --security-opt seccomp=unconfined \
              "$IMG" "check-$suite" $BLOCKING
          done

      - name: check suites — ADVISORY devices (reported, non-blocking)
        if: needs.descriptor-matrix.outputs.advisory != ''
        run: |
          rc=0
          for suite in control sensor skin; do
            echo "== check-$suite (advisory): $ADVISORY =="
            docker run --rm --network none \
              --device /dev/uinput --device-cgroup-rule "c 13:* rmw" -v /dev/input:/dev/input \
              --cap-add SYS_ADMIN --security-opt apparmor=unconfined --security-opt seccomp=unconfined \
              "$IMG" "check-$suite" $ADVISORY \
              || { rc=1; echo "::warning title=advisory sim descriptor gate::check-$suite FAILED for advisory devices ($ADVISORY) — reported, does not block"; }
          done
          [ "$rc" = 0 ] && echo "✓ advisory suites passed: $ADVISORY" || echo "advisory suites had failures (non-blocking): $ADVISORY"

      - name: Cleanup CI image
        if: always()
        run: docker image rm -f "$IMG" || true
