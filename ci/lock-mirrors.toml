# Exact consumer-side mirrors of platform.lock values. The gate reads this file
# from the candidate platform commit, resolves each consumer through the named
# candidate-lock SHA, and scans the full exact commit tree. Every 40/64-hex hit
# must be classified once as a load-bearing mirror or an incidental reference.
schema_version = 1

[[consumers]]
repo = "image"
url = "https://github.com/pocketforge-os/image.git"
commit_selector = "repos.image.sha"

[[mirrors]]
id = "image-gpu-um-toolchain-source"
platform_field = "repos.gpu-um-tsp.sha"
consumer_repo = "image"
consumer_path = "build/Dockerfile.pf"
parser = "template"
template = 'docker/Dockerfile.ge8300-mesa-cross at {value}. Do NOT add'
comparison = "equal"

[[mirrors]]
id = "image-runtime-guard"
platform_field = "repos.runtime.sha"
consumer_repo = "image"
consumer_path = "build/Dockerfile.pf"
parser = "template"
template = '[ "${PF_RUNTIME_SHA}" = "{value}" ] || { echo "FATAL: runtime pin drift: ${PF_RUNTIME_SHA}"; exit 1; }'
comparison = "equal"

[[mirrors]]
id = "image-recovery-args"
platform_field = "repos.recovery.sha"
consumer_repo = "image"
consumer_path = "build/Dockerfile.pf"
parser = "template"
template = 'ARG PF_RECOVERY_SHA={value}'
comparison = "equal"
expected_matches = 2

[[mirrors]]
id = "image-recovery-build-guard"
platform_field = "repos.recovery.sha"
consumer_repo = "image"
consumer_path = "build/Dockerfile.pf"
parser = "template"
template = '[ "${PF_RECOVERY_SHA}" = "{value}" ] || {'
comparison = "equal"

[[mirrors]]
id = "image-recovery-rootfs-guard"
platform_field = "repos.recovery.sha"
consumer_repo = "image"
consumer_path = "scripts/build-rootfs.sh"
parser = "template"
template = '[ "${PF_RECOVERY_SHA:-}" = "{value}" ] || {'
comparison = "equal"

[[mirrors]]
id = "image-launcher-guard"
platform_field = "repos.launcher.sha"
consumer_repo = "image"
consumer_path = "build/Dockerfile.pf"
parser = "template"
template = '[ "${PF_LAUNCHER_SHA}" = "{value}" ] || { echo "FATAL: F13 launcher pin drift: ${PF_LAUNCHER_SHA}"; exit 1; }'
comparison = "equal"

[[mirrors]]
id = "steamlink-ffmpeg-debian-version"
platform_field = "platform_runtime.steamlink_ffmpeg59_v1.build_args.PF_FFMPEG_DEBIAN_VERSION"
consumer_repo = "image"
consumer_path = "build/platform-runtimes/steamlink-ffmpeg59/v1/source.lock"
parser = "shell-assignment"
key = "FFMPEG_DEBIAN_VERSION"
comparison = "equal"

[[mirrors]]
id = "steamlink-ffmpeg-dsc"
platform_field = "platform_runtime.steamlink_ffmpeg59_v1.build_args.PF_FFMPEG_DSC_SHA256"
consumer_repo = "image"
consumer_path = "build/platform-runtimes/steamlink-ffmpeg59/v1/source.lock"
parser = "shell-assignment"
key = "FFMPEG_DSC_SHA256"
comparison = "equal"

[[mirrors]]
id = "steamlink-ffmpeg-orig"
platform_field = "platform_runtime.steamlink_ffmpeg59_v1.build_args.PF_FFMPEG_ORIG_SHA256"
consumer_repo = "image"
consumer_path = "build/platform-runtimes/steamlink-ffmpeg59/v1/source.lock"
parser = "shell-assignment"
key = "FFMPEG_ORIG_SHA256"
comparison = "equal"

[[mirrors]]
id = "steamlink-ffmpeg-orig-signature"
platform_field = "platform_runtime.steamlink_ffmpeg59_v1.build_args.PF_FFMPEG_ORIG_ASC_SHA256"
consumer_repo = "image"
consumer_path = "build/platform-runtimes/steamlink-ffmpeg59/v1/source.lock"
parser = "shell-assignment"
key = "FFMPEG_ORIG_ASC_SHA256"
comparison = "equal"

[[mirrors]]
id = "steamlink-ffmpeg-debian-patch"
platform_field = "platform_runtime.steamlink_ffmpeg59_v1.build_args.PF_FFMPEG_DEBIAN_SHA256"
consumer_repo = "image"
consumer_path = "build/platform-runtimes/steamlink-ffmpeg59/v1/source.lock"
parser = "shell-assignment"
key = "FFMPEG_DEBIAN_SHA256"
comparison = "equal"

[[mirrors]]
id = "steamlink-kernel-uapi-repo"
platform_field = "platform_runtime.steamlink_ffmpeg59_v1.source_repo"
consumer_repo = "image"
consumer_path = "build/platform-runtimes/steamlink-ffmpeg59/v1/source.lock"
parser = "shell-assignment"
key = "KERNEL_UAPI_REPO"
comparison = "equal"

[[mirrors]]
id = "steamlink-kernel-uapi-sha"
platform_field = "platform_runtime.steamlink_ffmpeg59_v1.build_args.PF_FFMPEG_UAPI_SHA"
aliases = [
  "platform_runtime.steamlink_ffmpeg59_v1.source_sha",
  "repos.kernel-sunxi-7.x.sha",
]
consumer_repo = "image"
consumer_path = "build/platform-runtimes/steamlink-ffmpeg59/v1/source.lock"
parser = "shell-assignment"
key = "KERNEL_UAPI_SHA"
comparison = "equal"

[[mirrors]]
id = "steamlink-patch-series"
platform_field = "platform_runtime.steamlink_ffmpeg59_v1.build_args.PF_FFMPEG_PATCH_SERIES_SHA256"
consumer_repo = "image"
consumer_path = "build/platform-runtimes/steamlink-ffmpeg59/v1/source.lock"
parser = "shell-assignment"
key = "PATCH_SERIES_SHA256"
comparison = "equal"

# The entries below classify non-load-bearing occurrences so the fallback sweep
# can distinguish documentation/test provenance from a newly introduced mirror.
# They are intentionally optional: historical prose may remain at an older SHA,
# but a current lock value at any undeclared location still fails closed.

