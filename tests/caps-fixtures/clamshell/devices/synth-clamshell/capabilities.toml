# tests/caps-fixtures/clamshell/devices/synth-clamshell/capabilities.toml
#
# SYNTHETIC two-screen clamshell for the descriptor v2 articulation rules (tsp-h5ed.46.3, D5/D6).
# NOT a real device: it lives under tests/, outside devices/, so it is never in ci-matrix.toml,
# never a `pf build` target and never in the catalog. Shape from research R4 section 4.2.
# Validate: `python3 core/caps.py --root tests/caps-fixtures/clamshell validate`.
# The PNGs and model.glb it references are generated by ../../gen_fixture.py (--check = drift gate).
schema_version = 2
accept_default = "south"

[identity]
id           = "synth-clamshell"
manufacturer = "PocketForge"
model        = "Synthetic Clamshell Fixture"
codename     = "test"
sdl_guid     = "030000005e0400008e02000010010000"   # borrowed Xbox-360 GUID (test-only)
match        = { evdev_name = "PF Synth Clamshell", vid = "045e", pid = "028e" }

[maturity]
declared = "sim-ready"           # derived: [model] present, every screen has a node, every input a skin_part

[physical]
envelope_mm = { w = 150.0, h = 75.0, d = 22.0 }    # closed envelope (base + lid, 11 mm each)

[model]
glb    = "skins/synth-clamshell/model.glb"
frame  = "pf-mm-v1"
naming = "pf-semantic-v1"

[[screens]]
id            = "top"
role          = "primary"
node          = "screen_top"
present       = "landscape"
rotation      = "none"
render_canvas = { w = 640, h = 480 }
display_rect  = { x = 80, y = 20, w = 480, h = 360 }   # 2D front skin
panel_px      = { w = 640, h = 480 }
fourcc        = "XR24"
diagonal_in   = 3.5
active_mm     = { w = 71.1, h = 53.3 }

[[screens]]
id            = "bottom"
role          = "secondary"
node          = "screen_bottom"
present       = "landscape"
rotation      = "none"
render_canvas = { w = 640, h = 480 }
panel_px      = { w = 640, h = 480 }
fourcc        = "XR24"
diagonal_in   = 3.5
active_mm     = { w = 71.1, h = 53.3 }
[screens.touch]
protocol = "st"
source   = "synth-touch"
x = { min = 0, max = 639 }
y = { min = 0, max = 479 }

# 12 inputs: hat + 4 face + 2 shoulders + select/start/guide + volume rocker (system, own node).
[[inputs]]
id = "dpad"
kind = "hat"
ev_type = "EV_ABS"
code = "ABS_HAT0X,ABS_HAT0Y"
skin_part = "dpad"
[[inputs]]
id = "south"
kind = "button"
ev_type = "EV_KEY"
code = "BTN_SOUTH"
label = "B"
skin_part = "btn_south"
[[inputs]]
id = "east"
kind = "button"
ev_type = "EV_KEY"
code = "BTN_EAST"
label = "A"
skin_part = "btn_east"
[[inputs]]
id = "west"
kind = "button"
ev_type = "EV_KEY"
code = "BTN_WEST"
label = "Y"
skin_part = "btn_west"
[[inputs]]
id = "north"
kind = "button"
ev_type = "EV_KEY"
code = "BTN_NORTH"
label = "X"
skin_part = "btn_north"
[[inputs]]
id = "l1"
kind = "button"
ev_type = "EV_KEY"
code = "BTN_TL"
skin_part = "btn_l1"
[[inputs]]
id = "r1"
kind = "button"
ev_type = "EV_KEY"
code = "BTN_TR"
skin_part = "btn_r1"
[[inputs]]
id = "select"
kind = "button"
ev_type = "EV_KEY"
code = "BTN_SELECT"
skin_part = "btn_select"
[[inputs]]
id = "start"
kind = "button"
ev_type = "EV_KEY"
code = "BTN_START"
skin_part = "btn_start"
[[inputs]]
id = "guide"
kind = "button"
ev_type = "EV_KEY"
code = "BTN_MODE"
skin_part = "btn_guide"
[[inputs]]
id = "vol_up"
kind = "button"
ev_type = "EV_KEY"
code = "KEY_VOLUMEUP"
class = "system"
source = "gpio-keys"
skin_part = "btn_vol_up"
[[inputs]]
id = "vol_down"
kind = "button"
ev_type = "EV_KEY"
code = "KEY_VOLUMEDOWN"
class = "system"
source = "gpio-keys"
skin_part = "btn_vol_down"

[[sensors]]
id = "hinge"
kind = "hinge_angle"
iio_device = "iio:device0"
units = "deg"

# The lid hinge. Values are degrees (kind = hinge); 0 = closed, 180 = flat open. The glb is
# authored at `rest` (default range[0]). SW_LID is a threshold switch on the JOINT value, not a
# posture side effect: it reads 1 while the angle is inside `active` (hysteresis 1 deg).
[[joints]]
id       = "lid"
kind     = "hinge"
node     = "pivot_lid"
axis     = [-1.0, 0.0, 0.0]
range    = [0.0, 180.0]
default  = 180.0
detents  = [0.0, 180.0]
sensor   = "hinge"
switches = [{ ev_type = "EV_SW", code = "SW_LID", source = "gpio-keys", active = [0.0, 10.0], hysteresis = 1.0 }]
# Postures tile [0, 180]: lo inclusive, hi exclusive, the last hi inclusive.
[[joints.postures]]
id               = "closed"
range            = [0.0, 10.0]
active_screens   = []
reachable_inputs = ["vol_up", "vol_down"]
[[joints.postures]]
id               = "half"
range            = [10.0, 150.0]
active_screens   = ["top", "bottom"]
[[joints.postures]]
id               = "open"
range            = [150.0, 180.0]
active_screens   = ["top", "bottom"]
screen_rotation  = { top = "none", bottom = "none" }

[skin]
body     = "skins/synth-clamshell/body.png"
lit_body = "skins/synth-clamshell/body_lit.png"
[skin.parts]
dpad         = { x = 40,  y = 420, w = 100, h = 100 }
btn_north    = { x = 520, y = 400, w = 40,  h = 40 }
btn_east     = { x = 560, y = 440, w = 40,  h = 40 }
btn_south    = { x = 520, y = 480, w = 40,  h = 40 }
btn_west     = { x = 480, y = 440, w = 40,  h = 40 }
btn_l1       = { x = 20,  y = 0,   w = 120, h = 10 }
btn_r1       = { x = 500, y = 0,   w = 120, h = 10 }
btn_select   = { x = 250, y = 560, w = 40,  h = 20 }
btn_guide    = { x = 300, y = 560, w = 40,  h = 20 }
btn_start    = { x = 350, y = 560, w = 40,  h = 20 }
btn_vol_up   = { x = 0,   y = 440, w = 10,  h = 30 }
btn_vol_down = { x = 0,   y = 480, w = 10,  h = 30 }
